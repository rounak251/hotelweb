services:
  - type: web
    name: luxury-stays
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 2 --threads 4
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://rounak251.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: luxury-stays-db
          property: connectionString

databases:
  - name: luxury-stays-db
    plan: free
    ipAllowList: []
